name: Build 4A firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Build label, for example v0.1.0-rc.1 (manual runs do not publish)'
        required: true
        default: 'v0.1.0-rc.1'

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      BUILD_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate build request
        run: python3 firmware/tools/ci-build.py --task-root "$RUNNER_TEMP/alwayroute" --version "$BUILD_VERSION"
      - name: Prepare disposable runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          echo "TASK_ROOT=$RUNNER_TEMP/alwayroute" >> "$GITHUB_ENV"
          # Only unrelated preinstalled software on this disposable VM is removed.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev zlib1g-dev \
            python3 python3-setuptools python3-pyelftools rsync swig unzip \
            file wget curl patch pkgconf time xsltproc
          df -h
      - name: Restore verified downloads and Go caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TASK_ROOT }}/caches
          key: 4a-ubuntu24-x64-v1-${{ hashFiles('firmware/sources.lock.json', 'firmware/release.json', 'config/routing/sources.lock.json') }}-${{ github.sha }}
          restore-keys: |
            4a-ubuntu24-x64-v1-${{ hashFiles('firmware/sources.lock.json', 'firmware/release.json', 'config/routing/sources.lock.json') }}-
      - name: Check release inputs and target protections
        run: |
          python3 tests/firmware/test_release_inputs.py
          python3 tests/firmware/test_ci_build.py
          python3 tests/firmware/test_target_profiles.py
          python3 tests/firmware/test_deployment_policy.py
          python3 tests/tools/test_routing_build.py
          python3 tests/firmware/test_routing_payload.py
          python3 tests/tools/test_flash.py
          python3 tests/integration/check-contract.py
          node --test tests/ui/ui.test.cjs
      - name: Build and inspect 4A image
        run: python3 firmware/tools/ci-build.py --task-root "$TASK_ROOT" --version "$BUILD_VERSION" --apply
      - name: Upload checked release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-release
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-build-logs
          path: |
            ${{ env.TASK_ROOT }}/logs/
            ${{ env.TASK_ROOT }}/openwrt-build/native-build.log
            ${{ env.TASK_ROOT }}/openwrt-build/native-build-state.json
            ${{ env.TASK_ROOT }}/release-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware-release
          path: release
      - name: Publish tag assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release/public
          sha256sum --check ../metadata/SHA256SUMS
          expected=$(python3 -c 'import json; print(json.load(open("../metadata/build-manifest.json"))["source_commit"])')
          object=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG")
          for i in 1 2 3 4 5; do
            type=$(jq -r '.object.type' <<< "$object")
            sha=$(jq -r '.object.sha' <<< "$object")
            if [[ "$type" != tag ]]; then break; fi
            object=$(gh api "repos/$GH_REPO/git/tags/$sha")
          done
          test "$type" = commit
          test "$sha" = "$expected"
          args=(--verify-tag --title "AlwayRoute $RELEASE_TAG" --notes-file ../metadata/release-notes.md)
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          shopt -s nullglob
          bundles=(./*.zip)
          images=(./*-sysupgrade.bin)
          test "${#bundles[@]}" -eq 1
          test "${#images[@]}" -eq 1
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 2
          # Creating an existing release fails; reruns never replace published assets.
          gh release create "$RELEASE_TAG" "${bundles[0]}" "${images[0]}" "${args[@]}"
